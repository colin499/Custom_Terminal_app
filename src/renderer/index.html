<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:">
  <title>Monk</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-drag"></div>
      <div id="sidebar-header">
        <span>Projects</span>
        <button id="add-project" title="Add project folder">+</button>
      </div>
      <ul id="project-list"></ul>
      <div id="sidebar-footer">
        <button id="launch-claude" title="Run claude in the current project">Launch Claude</button>
      </div>
    </aside>
    <main id="main">
      <div id="titlebar-drag"><span id="title-path"></span><span id="title-model"></span></div>
      <div id="statsbar" class="hidden">
        <div class="stat"><span class="label">Context</span><span class="bar"><span id="ctx-fill" class="fill"></span></span><span id="ctx-text" class="value"></span></div>
        <div class="stat"><span class="label">Budget</span><span class="bar"><span id="budget-fill" class="fill"></span></span><span id="budget-text" class="value"></span></div>
        <div class="stat"><span class="label">Session</span><span id="totals-text" class="value"></span></div>
      </div>
      <div id="empty-state">
        <h1>Monk</h1>
        <p>Drag a folder onto the sidebar or press + to add a project.</p>
      </div>
      <div id="terminals"></div>
    </main>
  </div>
  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
