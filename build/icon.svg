<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d45"/>
      <stop offset="1" stop-color="#15161e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <!-- macOS squircle-ish rounded rect, inset like standard icons -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#3b3f5c" stroke-width="6"/>
  <!-- title bar dots -->
  <circle cx="215" cy="215" r="24" fill="#f7768e"/>
  <circle cx="290" cy="215" r="24" fill="#e0af68"/>
  <circle cx="365" cy="215" r="24" fill="#9ece6a"/>
  <!-- prompt chevron -->
  <path d="M250 400 L430 560 L250 720" fill="none" stroke="url(#glow)" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor block -->
  <rect x="500" y="660" width="260" height="70" rx="14" fill="#c0caf5"/>
</svg>
